<title>命式読み比べ 二番勝負</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --ground:#eef0f4; --paper:#fbfbfd; --ink:#1d2138; --muted:#5d6380; --rule:#d5d9e4;
  --ai:#34438a; --ai-soft:#e3e7f6; --kin:#9a7a2f;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#12152a; --paper:#1a1e36; --ink:#e4e6f1; --muted:#9aa0bf; --rule:#2e3354;
  --ai:#9fb0ff; --ai-soft:#262d55; --kin:#d6b465;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#12152a; --paper:#1a1e36; --ink:#e4e6f1; --muted:#9aa0bf; --rule:#2e3354;
  --ai:#9fb0ff; --ai-soft:#262d55; --kin:#d6b465;}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.top h1{font-family:var(--serif);font-weight:700;font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.top .star{color:var(--kin)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 14px;padding-bottom:4px;
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:2;padding-top:6px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);
  color:var(--ink);font:inherit;font-size:.92rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.tab .pick:not(:empty){font-size:.75rem;background:var(--kin);color:var(--paper);border-radius:999px;padding:0 7px}
.tab:focus-visible,.vote button:focus-visible,.copy:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.pair{grid-template-columns:1fr}}
.reading{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.reading header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:6px}
.lbl{font-family:var(--serif);font-weight:700;font-size:1.5rem;color:var(--ai)}
.len{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.reading h3{font-family:var(--serif);font-size:1.12rem;line-height:1.5;margin:12px 0 8px;text-wrap:balance}
.reading p{font-family:var(--serif);font-size:1rem;line-height:1.95;margin:0 0 1em;max-width:36em}
.vote{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 0;padding:14px 16px;
  background:var(--ai-soft);border-radius:6px}
.vote .q{font-weight:700;margin-right:auto}
.vote button{font:inherit;border:1px solid var(--ai);background:var(--paper);color:var(--ai);
  padding:8px 16px;border-radius:6px;cursor:pointer;min-height:44px}
.vote button[aria-pressed="true"]{background:var(--ai);color:var(--paper)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar output{flex:1 1 320px;font-size:.88rem;color:var(--muted);word-break:break-all}
.copy{font:inherit;font-weight:700;border:0;background:var(--kin);color:var(--paper);padding:9px 16px;border-radius:6px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tab,.vote button{transition:background .15s,color .15s}}
</style>
<div class="wrap">
  <div class="top">
    <h1>命式読み比べ 二番勝負</h1>
    <p><span class="star">✦</span> ひでさん本人の命式（1977-05-24 01:34生）を、2つのAIに同じ指示で書かせました。どちらがどちらかは伏せています。占術ごとに「良いほう」を選んでください。<br>※ 本番アプリでは1,600字未満だと自動で書き直すので、短さより中身で選んでOKです。</p>
  </div>
  <nav class="tabs" role="tablist" aria-label="占術">{{TABS}}</nav>
  {{PANES}}
</div>
<div class="bar"><div class="in">
  <output id="summary" aria-live="polite">まだ選んでいません（0/{{N}}）</output>
  <button class="copy" id="copy">結果をコピー</button>
</div></div>
<script>
const NAMES={{NAMES}}, picks={};
try{Object.assign(picks,JSON.parse(localStorage.getItem("blind55")||"{}"))}catch(e){}
const label=v=>v==="="?"引分":v;
function render(){
  NAMES.forEach((n,i)=>{
    document.getElementById("pick-"+i).textContent=picks[i]?label(picks[i]):"";
    ["A","=","B"].forEach(v=>document.getElementById(`v-${i}-${v}`).setAttribute("aria-pressed",String(picks[i]===v)));
  });
  const done=Object.keys(picks).length;
  document.getElementById("summary").textContent=done?
    NAMES.map((n,i)=>`${n}=${picks[i]?label(picks[i]):"未"}`).join(" / ")+`（${done}/${NAMES.length}）`
    :`まだ選んでいません（0/${NAMES.length}）`;
  try{localStorage.setItem("blind55",JSON.stringify(picks))}catch(e){}
}
function show(i){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.i==i)));
  document.querySelectorAll(".pane").forEach((p,j)=>p.hidden=j!=i);
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>show(+t.dataset.i)));
document.querySelectorAll(".vote button").forEach(b=>b.addEventListener("click",()=>{
  const i=+b.dataset.i; picks[i]=b.dataset.v; render();
  const next=NAMES.findIndex((n,j)=>!picks[j]); if(next>=0) setTimeout(()=>show(next),250);
}));
document.getElementById("copy").addEventListener("click",async e=>{
  const t="読み比べ結果: "+document.getElementById("summary").textContent;
  try{await navigator.clipboard.writeText(t);e.target.textContent="コピーしました"}
  catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("summary"));
    getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="選択したのでコピーしてください"}
  setTimeout(()=>e.target.textContent="結果をコピー",2000);
});
render();
</script>
